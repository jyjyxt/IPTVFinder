<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PublicIPTV</title><link rel="stylesheet" href="style.css"><script src="popup.js" type="module"></script></head>
<body class="popup"><header><div class="brand"><img src="icons/48.png" width="32" height="32" alt=""><div><h1>PublicIPTV</h1></div></div><button id="open-player" class="quiet">Player</button><button id="back-to-streams" class="quiet" hidden>← Back to streams</button></header>
<section id="inline-player" class="inline-player" hidden><iframe id="player-frame" title="Stream player" allow="autoplay; fullscreen" allowfullscreen></iframe></section>
<section class="capture-panel"><div class="source-line"><span class="signal" id="signal"></span><strong id="page-title">Current page</strong></div><p id="capture-help">Capture starts automatically. Play a video on this page.</p><div class="actions"><button id="toggle" class="primary">Start capture</button><button id="reload">Reload &amp; capture</button></div></section>
<section class="results"><div class="section-heading"><h2>Detected streams <span id="count">0</span></h2><button id="clear" class="quiet">Clear</button></div><div class="filters"><input id="search" type="search" placeholder="Search name or URL" aria-label="Search streams"><select id="kind" aria-label="Stream type"><option value="">All formats</option><option>HLS</option><option value="VIDEO">Video</option></select></div><p id="notice" role="status" aria-live="polite"></p><div id="streams"></div><div id="empty" class="empty"><div class="empty-icon" aria-hidden="true">▶</div><h3>No streams yet</h3><p>Capture starts automatically. Press play on the website.</p></div></section>
<footer>Captured on this tab · Stored locally · No uploads</footer></body></html>
